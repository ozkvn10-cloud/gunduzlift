<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gündüz Lift | Yönetim</title><style>body{font:16px Arial;background:#edf2f7;color:#17334b;margin:0}main{max-width:1000px;margin:auto;padding:24px}article{background:white;padding:20px;border-radius:14px;margin:16px 0;display:grid;gap:12px}input,textarea,button{font:inherit;padding:10px;border:1px solid #b8c9d8;border-radius:7px;box-sizing:border-box}button{background:#174e78;color:white;cursor:pointer}img{max-width:220px;max-height:170px;object-fit:contain}label{display:grid;gap:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><h1>Gündüz Lift Yönetim Paneli</h1><a href="/">Siteyi aç</a><p id="status" role="status"></p><form id="login"><article><label>E-posta<input id="email" type="email" required></label><label>Şifre<input id="password" type="password" required></label><button>Giriş yap</button></article></form><section id="panel" hidden><button id="logout">Çıkış yap</button><article><h2>Bakım paketleri</h2><div id="packages"></div></article><button id="add">+ Model ekle</button><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://fsnygotiguzoowvvkxfj.supabase.co","sb_publishable_eCDLtHp3wNC4s7uN8dnNqQ_Me3U6tRR");</script><script>
const $=id=>document.getElementById(id), msg=t=>$('status').textContent=t;const check=r=>{if(r.error)throw r.error;return r.data};async function run(fn){try{await fn()}catch(e){msg(e.message||String(e))}}function field(root,label,value,type='text'){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.type=type;if(type==='checkbox')i.checked=value;else i.value=value??'';l.append(i);root.append(l);return i}function button(root,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>run(fn);root.append(b)}async function load(){const models=check(await db.from('elevator_models').select('*').order('sort_order'));const packages=check(await db.from('maintenance_packages').select('*').order('sort_order'));$('list').replaceChildren();$('packages').replaceChildren();for(const p of packages){const a=document.createElement('article');const title=field(a,'Paket',p.title),price=field(a,'Fiyat (örn. 1.500 TL / ay)',p.price),active=field(a,'Göster',p.is_active,'checkbox');button(a,'Paketi kaydet',async()=>{check(await db.from('maintenance_packages').update({title:title.value,price:price.value||'Teklif alın',is_active:active.checked}).eq('id',p.id).select().single());msg('Paket kaydedildi')});$('packages').append(a)}for(const m of models){const a=document.createElement('article');const title=field(a,'Model adı',m.title),desc=field(a,'Açıklama',m.description),order=field(a,'Sıra',m.sort_order,'number'),active=field(a,'Göster',m.is_active,'checkbox');let image=m.image_url||'';const preview=document.createElement('img');if(image)preview.src=image;a.append(preview);const f=document.createElement('input');f.type='file';f.accept='image/jpeg,image/png,image/webp';a.append(f);button(a,'Fotoğraf yükle ve kaydet',async()=>{const file=f.files[0];if(!file)throw Error('Fotoğraf seçin');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];if(!ext||file.size>10485760)throw Error('JPG, PNG veya WebP, en fazla 10 MB');const path=crypto.randomUUID()+'.'+ext;check(await db.storage.from('elevator-images').upload(path,file));image=db.storage.from('elevator-images').getPublicUrl(path).data.publicUrl;await save();preview.src=image});async function save(){check(await db.from('elevator_models').update({title:title.value,description:desc.value,sort_order:Number(order.value),is_active:active.checked,image_url:image}).eq('id',m.id).select().single());msg('Model kaydedildi')}button(a,'Kaydet',save);button(a,'Fotoğrafı kaldır',async()=>{image='';await save();preview.removeAttribute('src')});button(a,'Modeli sil',async()=>{if(confirm('Model silinsin mi?')){check(await db.from('elevator_models').delete().eq('id',m.id).select().single());await load()}});$('list').append(a)}}async function session(){const s=check(await db.auth.getSession()).session;let ok=false;if(s)ok=check(await db.rpc('is_admin'))===true;$('login').hidden=ok;$('panel').hidden=!ok;if(ok)await load();else if(s){await db.auth.signOut();msg('Yönetici yetkisi yok')}}$('login').onsubmit=e=>{e.preventDefault();run(async()=>{check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';await session()})};$('logout').onclick=()=>run(async()=>{check(await db.auth.signOut());await session()});$('add').onclick=()=>run(async()=>{check(await db.from('elevator_models').insert({title:'Yeni model',sort_order:999}).select().single());await load()});run(session);</script></body></html>

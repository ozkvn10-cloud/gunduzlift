<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gündüz Lift | Katalog yönetimi</title><style>body{font:16px Arial;background:#edf2f7;color:#17334b;margin:0}main{max-width:1000px;margin:auto;padding:24px}article{background:white;padding:20px;border-radius:14px;margin:16px 0;display:grid;gap:12px}input,textarea,button{font:inherit;padding:10px;border:1px solid #b8c9d8;border-radius:7px;box-sizing:border-box}button{background:#174e78;color:white;cursor:pointer}img{max-width:220px;max-height:170px;object-fit:contain}label{display:grid;gap:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}</style><main><h1>Katalog yönetimi</h1><p>Yerel demo — güvenli giriş ve ortak veritabanı henüz bağlı değil. Değişiklikler yalnızca bu tarayıcıda saklanır.</p><button onclick="models.push({title:'Yeni model',description:'',image:''});draw()">+ Model ekle</button> <a href="gunduz-lift-bakim.html">Siteyi aç</a><article><h2>Bakım paketleri yönetimi</h2><label style="display:flex;align-items:center;gap:10px"><input id="maintenanceVisible" type="checkbox" checked> Bakım paketleri sitede görünsün</label><label>Aylık bakım ücreti (TL)<input id="monthlyFee" type="number" min="0" step="0.01" placeholder="Boşsa teklif alın"></label><label>Yıllık sözleşme ücreti (TL)<input id="annualFee" type="number" min="0" step="0.01" placeholder="Boşsa teklif alın"></label><button id="saveMaintenance">Bakım paketlerini kaydet</button><p id="maintenanceStatus" role="status"></p></article><div id="list"></div><button onclick="save()">Değişiklikleri kaydet</button><p id="status" role="status"></p></main><script>const defaults=[{"title": "Panoramik cam asansör", "description": "Cam yüzeyli kabin; otel, AVM ve modern yapılar için.", "image": ""}, {"title": "Paslanmaz çelik yolcu asansörü", "description": "Dayanıklı kabin yüzeyleri; konut ve iş merkezleri için.", "image": ""}, {"title": "Lüks dekoratif kabin", "description": "Dekoratif yüzeyler ve aydınlatma seçenekleri.", "image": ""}, {"title": "Villa ve ev tipi asansör", "description": "Konut içi kullanım için projeye özel çözümler.", "image": ""}, {"title": "Hastane ve sedye asansörü", "description": "Sağlık yapılarında sedye taşımaya uygun proje seçenekleri.", "image": ""}, {"title": "Yük asansörü", "description": "Depo ve ticari yapılarda yük taşımaya yönelik çözümler.", "image": ""}, {"title": "Engelli platform asansörü", "description": "Erişilebilirlik ihtiyaçlarına yönelik platform seçenekleri.", "image": ""}, {"title": "Modern apartman asansörü", "description": "Apartmanlara uygun kabin ve kapı seçenekleri.", "image": ""}];let models;try{models=JSON.parse(localStorage.getItem('gunduzCatalog'))||defaults}catch{models=defaults}function draw(){const root=document.getElementById('list');root.replaceChildren();models.forEach((m,i)=>{const a=document.createElement('article');for(const [key,label] of [['title','Model adı'],['description','Açıklama'],['image','Görsel URL']]){const l=document.createElement('label');l.textContent=label;const input=document.createElement(key==='description'?'textarea':'input');input.value=m[key];input.oninput=()=>m[key]=input.value;l.append(input);a.append(l)}if(m.image){const img=document.createElement('img');img.src=m.image;a.append(img)}const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp';file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,900/img.width,900/img.height);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);m.image=c.toDataURL('image/jpeg',.72);draw()};img.src=r.result};r.readAsDataURL(f)};a.append(file);const row=document.createElement('div');row.className='actions';for(const [label,fn] of [['Yukarı',()=>{if(i>0)[models[i-1],models[i]]=[models[i],models[i-1]]}],['Aşağı',()=>{if(i<models.length-1)[models[i+1],models[i]]=[models[i],models[i+1]]}],['Fotoğrafı kaldır',()=>m.image=''],['Modeli sil',()=>{if(confirm('Model silinsin mi?'))models.splice(i,1)}]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();draw()};row.append(b)}a.append(row);root.append(a)})}function save(){try{localStorage.setItem('gunduzCatalog',JSON.stringify(models));document.getElementById('status').textContent='Yerel olarak kaydedildi.'}catch(e){document.getElementById('status').textContent='Kaydedilemedi: tarayıcı depolama sınırı veya erişim hatası.'}}draw()</script><script>(()=>{let x={};try{x=JSON.parse(localStorage.getItem('gunduzMaintenance'))||{}}catch{}const v=document.getElementById('maintenanceVisible'),m=document.getElementById('monthlyFee'),y=document.getElementById('annualFee'),status=document.getElementById('maintenanceStatus');v.checked=x.visible!==false;m.value=x.monthly??'';y.value=x.annual??'';document.getElementById('saveMaintenance').onclick=()=>{if(!m.checkValidity()||!y.checkValidity()){status.textContent='Geçerli, negatif olmayan ücret girin.';return}try{localStorage.setItem('gunduzMaintenance',JSON.stringify({visible:v.checked,monthly:m.value,annual:y.value}));status.textContent='Yerel olarak kaydedildi.'}catch{status.textContent='Kaydedilemedi.'}}})();</script></html>
